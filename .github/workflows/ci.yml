name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax checks
        run: |
          python3 -m py_compile quota_view.py tests/test_quota_view.py
          bash -n install.sh
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
